name: Security

on:
  pull_request:
  push:
    branches: [main, devsecops-security-audit]

permissions:
  contents: read

jobs:
  security:
    name: SAST, secret scan, and SCA
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Semgrep SAST (pinned)
        run: |
          mkdir -p audit-evidence
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src semgrep/semgrep:1.75.0 \
            semgrep scan --config p/javascript --error --json --output audit-evidence/semgrep.json .

      - name: Gitleaks Git-history scan (pinned)
        run: |
          mkdir -p audit-evidence
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src zricethezav/gitleaks:v8.21.2 \
            detect --source . --redact --report-format json --report-path audit-evidence/gitleaks.json --exit-code 1

      - name: IaC scan - Trivy Dockerfile (pinned)
        run: npm run security:iac

      - name: IaC scan - KICS Docker Compose (pinned)
        run: |
          mkdir -p audit-evidence/kics
          docker run --rm -v "$GITHUB_WORKSPACE:/path" checkmarx/kics:v2.2.1 \
            scan -p /path/docker-compose.yml -o /path/audit-evidence/kics --report-formats json --fail-on high,critical

      - name: npm audit SCA
        shell: bash
        run: |
          mkdir -p audit-evidence
          set +e
          npm audit --omit=dev --audit-level=critical --json > audit-evidence/npm-audit.json
          status=$?
          set -e
          if ! jq empty audit-evidence/npm-audit.json; then
            echo 'npm audit did not produce valid JSON.' >&2
            exit 2
          fi
          exit "$status"

      # Security reports are intentionally not uploaded or committed. They can
      # contain sensitive finding metadata and remain only on the ephemeral runner.
