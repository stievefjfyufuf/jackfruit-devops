services:
  app:
    image: ${APP_IMAGE:-jack-fruit-devops:local}
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /app/data/inventory.sqlite
      SEED_DATA: ${SEED_DATA:-true}
    volumes:
      - inventory_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s
volumes:
  inventory_data:
    name: jack-fruit-devops-data
